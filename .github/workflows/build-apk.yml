name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["arena/e47ee8b1-ftp"]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Make sure an Android SDK with platform/build-tools 35 is available,
      # downloading the command-line tools first if the runner has none.
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            for candidate in /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager \
                             /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager; do
              if [ -x "$candidate" ]; then SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$candidate")")")")"; break; fi
            done
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Downloading Android command-line tools to $SDK_ROOT"
            curl -sSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            cp -r /tmp/cmdline-tools-extract/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      # Temporary debugging: artifact downloads are not reachable from the
      # dev environment, so surface the important errors as annotations.
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -n -E "^e: |error:|FAILED|What went wrong|Caused by:|Exception" build-log.txt | head -30 | while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::$esc"
          done
          echo "----- log tail -----"
          tail -40 build-log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneFTP-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload BT Auto Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: BTAutoConnect-apk
          path: btapp/build/outputs/apk/debug/btapp-debug.apk
          if-no-files-found: error

      # Deliver both APKs as GitHub Release assets so they have direct
      # download links. (Re-runs replace the assets via --clobber.)
      - name: Deliver APKs to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PhoneFTP.apk
          cp btapp/build/outputs/apk/debug/btapp-debug.apk BTAutoConnect.apk
          ls -lh PhoneFTP.apk BTAutoConnect.apk
          gh release upload v0.3.2 PhoneFTP.apk BTAutoConnect.apk --clobber || \
            gh release create v0.3.2 PhoneFTP.apk BTAutoConnect.apk \
              --title "PhoneFTP v0.2.2 + BT Auto Connect v0.1.2 — stable signing: updates now install over the old version (one last uninstall needed if coming from a build before v0.3.2)" \
              --notes "Two apps: 1) PhoneFTP.apk - always-on FTP server (default port 9999, username/password: mou). 2) BTAutoConnect.apk - auto-connects your Roseland TWS RE-500 / itel T1Neo / MusicMan BT-X78 when Bluetooth turns on, one device at a time (devices must be paired once first). Download an APK, allow 'Install unknown apps', and install it."
          gh release view v0.3.2
