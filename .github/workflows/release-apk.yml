name: Publish APK to Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the successful build
        uses: actions/download-artifact@v4
        with:
          name: PhoneFTP-apk
          run-id: 40574058900
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to the v0.1.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh
          mv app-debug.apk PhoneFTP.apk
          gh release upload v0.1.0 PhoneFTP.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY"
